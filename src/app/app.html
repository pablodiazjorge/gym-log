<div class="min-h-dvh bg-gray-950 flex flex-col">
  <app-header />

  <!-- Main content -->
  <main class="flex-1 max-w-lg mx-auto w-full">
    <router-outlet />
  </main>

  <!-- Bottom navigation (mobile) -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-gray-900/95 backdrop-blur-xl border-t border-gray-800" style="padding-bottom: env(safe-area-inset-bottom, 0px)">
    <div class="flex items-center justify-around max-w-lg mx-auto h-16 px-1">
      <a routerLink="/" routerLinkActive="text-white"
        [routerLinkActiveOptions]="{exact: true}"
        class="flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/>
        </svg>
        <span class="text-[10px] font-medium">Home</span>
      </a>

      <a routerLink="/routines" routerLinkActive="text-white"
        class="flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
        <span class="text-[10px] font-medium">Routines</span>
      </a>

      <a routerLink="/history" routerLinkActive="text-white"
        class="flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-[10px] font-medium">History</span>
      </a>

      <a routerLink="/analysis" routerLinkActive="text-white"
        class="flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[10px] font-medium">Analysis</span>
      </a>

      <a routerLink="/profile" routerLinkActive="text-white"
        class="flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-[10px] font-medium">Profile</span>
      </a>
    </div>
  </nav>
</div>
