<div class="min-h-dvh bg-gray-950 flex flex-col">
  <app-header />

  <!-- Main content -->
  <main class="flex-1 max-w-lg mx-auto w-full">
    <router-outlet />
  </main>

  <!-- Bottom navigation: floating dock (Coach). The outer nav keeps the device
       safe area; the bar itself floats inset from the edges. -->
  <nav class="fixed bottom-0 left-0 right-0 z-50" style="padding-bottom: env(safe-area-inset-bottom, 0px)">
    <div class="max-w-lg mx-auto px-3.5 pb-3.5">
      <div class="flex items-center justify-around h-16 px-1 rounded-2xl bg-gray-800/90 backdrop-blur-xl shadow-lg shadow-black/40">
        <a routerLink="/" routerLinkActive="dock-active text-accent"
          [routerLinkActiveOptions]="{exact: true}"
          class="dock-link flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
          <app-icon name="home" class="w-5 h-5" />
          <span class="text-[10px] font-medium">Home</span>
        </a>

        <a routerLink="/routines" routerLinkActive="dock-active text-accent"
          class="dock-link flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
          <app-icon name="clipboard-list" class="w-5 h-5" />
          <span class="text-[10px] font-medium">Routines</span>
        </a>

        <a routerLink="/history" routerLinkActive="dock-active text-accent"
          class="dock-link flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
          <app-icon name="clock" class="w-5 h-5" />
          <span class="text-[10px] font-medium">History</span>
        </a>

        <a routerLink="/analysis" routerLinkActive="dock-active text-accent"
          class="dock-link flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
          <app-icon name="chart-column" class="w-5 h-5" />
          <span class="text-[10px] font-medium">Analysis</span>
        </a>

        <a routerLink="/profile" routerLinkActive="dock-active text-accent"
          class="dock-link flex flex-col items-center gap-0.5 px-2 py-1 text-gray-500 hover:text-gray-300 transition-colors min-w-0">
          <app-icon name="user" class="w-5 h-5" />
          <span class="text-[10px] font-medium">Profile</span>
        </a>
      </div>
    </div>
  </nav>
</div>
