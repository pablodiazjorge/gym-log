<header class="sticky top-0 z-50 bg-gray-950/80 backdrop-blur-xl border-b border-gray-800/50">
  <div class="flex items-center justify-between h-12 px-4 max-w-lg mx-auto">
    <div class="w-10">
      @if (!isHome()) {
        <button (click)="goBack()"
          class="w-10 h-10 flex items-center justify-center -ml-2 rounded-xl text-gray-400 hover:text-gray-200 hover:bg-gray-800/50 transition-colors"
          aria-label="Volver">
          <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
          </svg>
        </button>
      }
    </div>
    <h1 class="text-sm font-semibold text-gray-300 tracking-tight">{{ title() }}</h1>
    <div class="w-10"></div>
  </div>
</header>
