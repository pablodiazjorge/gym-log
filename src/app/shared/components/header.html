<header class="fixed top-0 left-0 right-0 z-50 bg-slate-800/95 backdrop-blur border-b border-slate-700">
  <div class="flex items-center justify-between h-14 px-4 max-w-lg mx-auto">
    <!-- Back button (hidden on home) -->
    <div class="w-10">
      @if (!isHome()) {
        <button
          (click)="goBack()"
          class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-300 hover:bg-slate-700 active:bg-slate-600 transition-colors"
          aria-label="Volver"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
        </button>
      }
    </div>

    <!-- Title -->
    <h1 class="text-lg font-semibold text-slate-100 truncate px-2">{{ title() }}</h1>

    <!-- Right slot -->
    <div class="w-10"></div>
  </div>
</header>

<!-- Spacer for fixed header -->
<div class="h-14"></div>
