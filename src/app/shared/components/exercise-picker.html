<div>
  <div class="flex items-center justify-between mb-4">
    <!-- h2, not h1: in the workout the sticky header's h1 stays visible above this -->
    <h2 class="text-xl font-bold">{{ heading() }}</h2>
    <button (click)="closed.emit()"
      class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-white transition-colors"
      aria-label="Close picker">
      <app-icon name="x" class="w-5 h-5" [strokeWidth]="2" />
    </button>
  </div>

  <!-- Category filter tabs -->
  <div class="flex gap-2 overflow-x-auto pb-3 mb-4 scrollbar-hide">
    @for (cat of categories; track cat.value) {
      <button (click)="selectCategory(cat.value)"
        class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
        [class.bg-gray-700]="activeCategory() === cat.value"
        [class.text-white]="activeCategory() === cat.value"
        [class.bg-gray-900]="activeCategory() !== cat.value"
        [class.text-gray-400]="activeCategory() !== cat.value"
        [class.hover:bg-gray-800]="activeCategory() !== cat.value">
        {{ cat.label }}
      </button>
    }
  </div>

  <div class="space-y-2">
    @for (exercise of filteredExercises(); track exercise.id) {
      <button (click)="picked.emit(exercise)"
        class="w-full text-left p-4 rounded-xl bg-gray-900 hover:bg-gray-800/70 transition-colors flex items-center gap-3">
        <div class="flex-1 min-w-0">
          <p class="font-medium text-white truncate">{{ exercise.name }}</p>
          <p class="text-xs text-gray-500 mt-0.5">
            {{ exercise.targetSets }} sets × {{ exercise.targetRepsMin }}-{{ exercise.targetRepsMax }} reps
          </p>
        </div>
        <span class="text-xs px-2 py-0.5 rounded font-medium flex-shrink-0"
          [class]="badge(exercise.category)">
          {{ exercise.category }}
        </span>
      </button>
    }
    @if (filteredExercises().length === 0) {
      <p class="text-center text-gray-500 text-sm py-8">No exercises left in this category</p>
    }
  </div>
</div>
